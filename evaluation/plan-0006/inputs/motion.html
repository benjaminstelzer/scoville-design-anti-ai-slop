<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Station queues</title><style>*{box-sizing:border-box}body{font:18px Arial;margin:0;background:#f7f6fb;color:#242039}main{max-width:1000px;margin:auto;padding:32px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border:1px solid #ddd;border-radius:18px;padding:20px}.value{font-size:38px}.pulse{animation:pop .8s ease}@keyframes pop{0%{opacity:.1;transform:scale(.8)}100%{opacity:1;transform:scale(1)}}button{font:inherit;padding:12px 18px;margin-top:30px} @media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style><body><main><h1>Station queues</h1><p>Fictional operational training data. Decide which station needs relief first. Backlog is waiting items; capacity is items this shift can process.</p><div id="cards" class="cards"></div><button id="advance">Advance sample</button><p id="sample" aria-live="polite"></p></main><script>const samples=[{A:18,B:42,C:9,D:16},{A:22,B:56,C:12,D:12}];const capacity={A:30,B:40,C:20,D:20};let sample=0;function draw(){document.querySelector('#cards').innerHTML=Object.entries(samples[sample]).map(([id,n])=>'<section class="card pulse"><h2>Station '+id+'</h2><div class="value">'+n+'</div><p>waiting items</p><p>Shift capacity: '+capacity[id]+'</p></section>').join('');document.querySelector('#sample').textContent='Sample '+(sample+1)+' of 2';}document.querySelector('#advance').onclick=()=>{sample=1-sample;draw()};draw();</script></body></html>
